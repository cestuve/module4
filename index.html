.culture-strategy-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.culture-strategy:last-child{grid-column:1/-1}.culture-case{display:grid;grid-template-columns:100px 1fr;gap:15px;align-items:center;padding:14px;border:3px solid rgba(46,74,93,.12);border-radius:18px;background:#fff7e9;margin:11px 0}.culture-case:nth-of-type(even){background:#eef5f4}.culture-case img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:4px solid #fff;background:#fff;box-shadow:0 7px 15px rgba(36,55,70,.14)}.culture-case strong{display:block;font-size:17px;color:var(--navy);margin-bottom:4px}.culture-case p{margin:4px 0 8px!important;font-size:13px!important}.culture-case select{width:100%;border:2px solid rgba(46,74,93,.18);background:#fffdfa;color:var(--navy);border-radius:12px;padding:10px;font-weight:750}.culture-case.answer-incorrect{border-color:#d58c86;background:#fff1f0}
.resource-link-card{display:block;text-decoration:none}.resource-link-card:hover{transform:translateY(-2px);border-color:var(--gold)}
.summary-grid-five{grid-template-columns:repeat(5,minmax(0,1fr))}.summary-grid-five .summary-card{padding:13px}.summary-grid-five .summary-card strong{font-size:14px}.summary-grid-five .summary-card span{font-size:11px}
.risk-row.answer-incorrect,.culture-case.answer-incorrect{border-color:#d58c86;background:#fff1f0;box-shadow:0 0 0 2px rgba(184,92,92,.12)}
@media(max-width:1050px){.scope-grid,.gift-grid,.summary-grid-five{grid-template-columns:repeat(2,minmax(0,1fr))}.toolkit-grid,.warning-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.warning-card:last-child{grid-column:auto}.pause-path{grid-template-columns:1fr}.pause-arrow{transform:rotate(90deg);min-height:22px}.timeline{grid-template-columns:1fr}.timeline>span{transform:rotate(90deg);text-align:center}.duo-profile{grid-template-columns:95px 1fr 95px}.duo-profile img{width:82px;height:82px}}
@media(max-width:720px){.boundary-card-grid,.principle-grid,.ethics-grid,.scope-grid,.toolkit-grid,.warning-grid,.ripple-grid,.trigger-grid,.case-index,.disclosure-meter,.gift-grid,.culture-strategy-grid,.summary-grid-five,.checkbox-grid{grid-template-columns:1fr}.ethics-card:last-child,.culture-strategy:last-child{grid-column:auto}.ripple-wrap{grid-template-columns:1fr}.ripple-center{width:128px;margin:auto}.duo-profile{grid-template-columns:1fr;text-align:center}.duo-profile img{width:95px;height:95px}.culture-case{grid-template-columns:1fr;text-align:center}.culture-case img{justify-self:center}}

.checkbox-grid.uniform-beige label{background:#fff7e9!important}
.timeline-icon{display:block;font-size:38px;line-height:1;margin-bottom:5px}
.profile-card.compact-profile img[src*="Jacob_Headshot.png"],.duo-profile img[alt="Jared"],.duo-profile img[alt="Maya"],.duo-profile img[alt="Dante"],.duo-profile img[src*="Gift_Client_Headshot.png"]{object-position:center 30%}
.primary-btn:disabled{opacity:.48;cursor:not-allowed;transform:none}

.all-beige-boundary > .boundary-card,
.all-beige-principles > .principle-card,
.all-beige-warnings > .warning-card,
.all-beige-ethics > .ethics-card,
.all-beige-scope > .scope-card,

<body>
<a class="sr-only" href="#mainContent">Skip to course content</a>
<div class="app" id="app">
<header class="hud hidden" id="courseHud" aria-label="Course menu"><button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false">Menu ▾</button><div class="menu hidden" id="sceneMenu" aria-hidden="true"></div></header>
<main id="mainContent"></main>
<div class="modal-backdrop hidden" id="modalBackdrop" role="dialog" aria-modal="true" aria-hidden="true"><div class="modal" id="modalPanel"><button class="close-btn" id="closeModal" aria-label="Close dialog">×</button><div id="modalContent"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div><div class="sr-only" id="srStatus" aria-live="polite"></div>
</div>
<script>
(() => {
'use strict';
const IMG={
 exterior:'https://cestuve.github.io/module1/BG-01.png',
 finalExterior:'https://cestuve.github.io/module1/BG-08.png',
 office:'https://cestuve.github.io/module2/Maria_Office.png',
 supervision:'https://cestuve.github.io/module4/Supervision_Room.png',
 wellness:'https://cestuve.github.io/module4/Staff_Wellness_Room.png',
 conference:'https://cestuve.github.io/module4/Case_Conference_Room.png',
 mariaFull:'https://cestuve.github.io/module4/Maria_Fullbody.png',
 mariaHead:'https://cestuve.github.io/module4/Maria_Headshot.png',
 gabrielaFull:'https://cestuve.github.io/module4/Gabriela_Fullbody.png',
 gabrielaHead:'https://cestuve.github.io/module4/Gabriela_Headshot.png',
 jacobFull:'https://cestuve.github.io/module4/Jacob_Fullbody.png',
 jacobHead:'https://cestuve.github.io/module4/Jacob_Headshot.png',
 jared:'https://cestuve.github.io/module4/Jared_Headshot.png',
 maya:'https://cestuve.github.io/module4/Maya_Headshot.png',
 marla:'https://cestuve.github.io/module4/Marla_Headshot.png',
 dante:'https://cestuve.github.io/module4/Dante_Headshot.png',
 alexis:'https://cestuve.github.io/module4/Alexis_Headshot.png',
 chen:'https://cestuve.github.io/module4/Chen_Headshot.png',
 formerClient:'https://cestuve.github.io/module4/Former_Client_Headshot.png',
 koda:'https://cestuve.github.io/module4/Koda_Headshot.png',
 giftClient:'https://cestuve.github.io/module4/Gift_Client_Headshot.png',
 trainee:'https://cestuve.github.io/module4/CDCA_Trainee_Headshot.png',
 attachmentClient:'https://cestuve.github.io/module4/Attachment_Client_Headshot.png',
 culturalGift:'https://cestuve.github.io/module4/Cultural_Gift_Client_Headshot.png',
 culturalDisclosure:'https://cestuve.github.io/module4/Cultural_Disclosure_Client_Headshot.png',
 culturalSpace:'https://cestuve.github.io/module4/Cultural_Space_Client_Headshot.png'
};
const sections=[
 ['Week 4','Begin at Harbor Point'],
 ['Boundary Foundations','Personal & professional limits'],
 ['Ethics & Scope','Codes, supervision & legal responsibilities'],
 ['Self-Awareness','Triggers & maintaining boundaries'],
 ['Professional Well-Being','Burnout & compassion fatigue'],
 ['Case Conference','Apply professional boundaries'],
 ['Culture & Boundaries','Warm, respectful & professional'],
 ['Complete','Download your reflection PDF']
];
const state={name:'',maxSection:0,reflections:{boundary:'',selfaware:'',caseapp:'',reallife:''}};
const main=document.getElementById('mainContent'),hud=document.getElementById('courseHud'),menu=document.getElementById('sceneMenu'),menuToggle=document.getElementById('menuToggle'),modalBackdrop=document.getElementById('modalBackdrop'),modalContent=document.getElementById('modalContent'),closeModalBtn=document.getElementById('closeModal'),toast=document.getElementById('toast'),srStatus=document.getElementById('srStatus');
function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function say(t){srStatus.textContent=t}
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2400)}
function showModal(html){modalContent.innerHTML=html;modalBackdrop.classList.remove('hidden');modalBackdrop.setAttribute('aria-hidden','false');const h=modalContent.querySelector('h2');if(h){h.id='modalTitle';modalBackdrop.setAttribute('aria-labelledby','modalTitle')}setTimeout(()=>{const first=modalContent.querySelector('button,select,textarea,input,a');if(first)first.focus()},20)}
function closeModal(){modalBackdrop.classList.add('hidden');modalBackdrop.setAttribute('aria-hidden','true')}
function headQuote(img,name,text){return `<div class="quote-card quote-with-headshot"><img src="${img}" alt="${esc(name)}"><div><strong>${esc(name)}</strong><p>${text}</p></div></div>`}
function duoProfile(img1,name1,img2,name2,copy=''){return `<div class="duo-profile"><div><img src="${img1}" alt="${esc(name1)}"><strong>${esc(name1)}</strong></div><div class="duo-copy">${copy}</div><div><img src="${img2}" alt="${esc(name2)}"><strong>${esc(name2)}</strong></div></div>`}
function setSection(i){state.maxSection=Math.max(state.maxSection,i);renderMenu()}
function renderMenu(){menu.innerHTML=sections.map((s,i)=>`<button class="menu-item" type="button" data-jump="${i}" ${i>state.maxSection?'disabled':''}>${i+1}. ${s[0]}<span>${s[1]}</span></button>`).join('')}
menuToggle.addEventListener('click',e=>{e.stopPropagation();menu.classList.toggle('hidden');menuToggle.setAttribute('aria-expanded',menu.classList.contains('hidden')?'false':'true')});
document.addEventListener('click',e=>{if(!menu.contains(e.target)&&e.target!==menuToggle){menu.classList.add('hidden');menuToggle.setAttribute('aria-expanded','false')}});
closeModalBtn.addEventListener('click',closeModal);modalBackdrop.addEventListener('click',e=>{if(e.target===modalBackdrop)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});


function titleIntro(){main.innerHTML=`<section class="intro-scene"><div class="intro-panel"><span class="mini-label">Harbor Point · Module 4</span><h1>Personal &amp; Professional Boundaries</h1><div class="intro-rule"></div><p class="intro-lead">As a chemical dependency counselor assistant, one of your most important responsibilities is establishing and maintaining healthy boundaries with the people you serve.</p><p class="intro-copy">Boundaries help define appropriate behavior, protect the helping relationship, and create a safe, ethical, and professional environment for both clients and counselors.</p><p class="intro-copy">Boundary challenges can be especially common in substance use treatment. Clients may be vulnerable, helping relationships can become emotionally intense, and professionals may experience their own emotional reactions, personal triggers, or desire to rescue someone.</p><p class="intro-copy">During this week at Harbor Point, you’ll practice balancing compassion with professionalism while learning how boundaries protect clients, counselors, agencies, and the helping relationship.</p><div class="button-row"><button class="primary-btn" data-action="go-exterior">Return to Harbor Point →</button></div></div></section>`}
function exterior(){hud.classList.remove('hidden');setSection(0);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.exterior}')"><div class="scene-title-card" style="top:110px;left:7%;text-align:left"><span class="mini-label">Week 4 · Back at Harbor Point</span><h1>Harbor Point Recovery Services</h1><p>Maria is waiting in her office to talk with you about this week’s work.</p></div><button class="hotspot" type="button" aria-label="Enter Harbor Point" data-action="enter-office" style="left:52%;top:34%;width:18%;height:36%"></button></div></section>`}
function officeScene(){setSection(0);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.office}')"><div class="scene-guide">Meet with Maria to begin Week 4.</div><img class="character" src="${IMG.mariaFull}" alt="" style="left:50%;transform:translateX(-50%);bottom:-2%;height:70vh"><button class="character-hotspot" data-action="maria-week4" type="button" aria-label="Talk with Maria" style="left:50%;transform:translateX(-50%);bottom:2%;width:28%;height:64%"></button></div></section>`}
function mariaWeek4(){showModal(`<h2>Week 4 at Harbor Point</h2><p>Over the last few weeks, you’ve spent a lot of time thinking about what clients need. This week, the focus shifts to what clients need from you as a professional and what they should not have to depend on you for personally.</p>${headQuote(IMG.mariaHead,'Maria','“Caring about clients is important. But good intentions don’t automatically create good boundaries. Sometimes the situations that feel most compassionate are exactly the ones where we need to slow down, think ethically, and ask for supervision.”')}<p>Harbor Point is reviewing several professional boundary situations today. You’ll help think through social media issues, self-disclosure, dual relationships, personal triggers, burnout, cultural expectations, and more.</p><div class="field"><label for="learnerName">Your name</label><input id="learnerName" type="text" value="${esc(state.name)}" placeholder="Enter your name for the reflection PDF"></div><div class="button-row center"><button class="primary-btn" data-action="start-instinct">Start With a Boundary Check →</button></div>`)}

const instinct=[
 {q:'It is okay to accept a friend request from a current client on your personal social-media account.',opts:['True','False'],answer:1,feedback:'Accepting the request can blur professional and personal boundaries, expose private information, create confidentiality concerns, and affect professional judgment.'},
 {q:'It is acceptable to tell clients about your personal life because they tell you about theirs.',opts:['True','False'],answer:1,feedback:'When considering self-disclosure, ask yourself, “Is sharing this information in the best interest of the client’s recovery, or am I meeting one of my own emotional needs?”'},
 {q:'Which best defines a professional boundary?',opts:['A rigid rule created by an employer','A line that separates personal and professional roles','A list of duties in a job description','An emotional reaction to a client'],answer:1,feedback:'Professional boundaries define the limits of the counselor’s role so interactions remain ethical, professional, and focused on client needs.'},
 {q:'What is the main reason professionals should maintain appropriate boundaries with clients?',opts:['To preserve client safety and the integrity of the helping relationship','To protect the counselor’s reputation','To avoid doing additional work','To stay emotionally detached'],answer:0,feedback:'Professional boundaries are not about becoming emotionally detached. Their primary purpose is to protect client safety and maintain the integrity of the professional relationship.'},
 {q:'Giving a client a ride home after a session is always acceptable as long as you personally feel safe.',opts:['True','False'],answer:1,feedback:'Agencies typically have policies regarding client transportation. Check agency guidance and consult supervision rather than assuming personal transportation is appropriate.'},
 {q:'What is one major risk of unclear professional boundaries?',opts:['Receiving too many referrals','Having additional paperwork','Creating dependency or emotional harm for the client','Having less supervision time'],answer:2,feedback:'When roles become unclear, clients may become overly dependent on a professional or confused about the relationship. This can cause emotional harm and undermine client independence.'}
];
function instinctCheck(i=0){const s=instinct[i];const intro=i===0?'<p>Let’s start off with a few quick questions to get you thinking about boundaries. This will help you to see what you already know and give yourself a starting point before we dive into seeing clients this week.</p>':'';showModal(`<h2>Boundary Instinct Check</h2><div class="step-pill">Question ${i+1} of ${instinct.length}</div>${intro}<div class="teaching-card"><h3>${s.q}</h3></div><div class="choices">${s.opts.map((o,j)=>`<button class="choice-btn" data-action="instinct-choice" data-i="${i}" data-v="${j}"><span class="choice-title">${String.fromCharCode(65+j)}.</span><span class="choice-text">${o}</span></button>`).join('')}</div><div data-feedback></div>`) }

function foundationsScene(){closeModal();setSection(1);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.supervision}')"><div class="scene-guide">Maria wants to start with a basic question: where is the line between personal and professional?</div><img class="character" src="${IMG.mariaFull}" alt="" style="left:50%;transform:translateX(-50%);bottom:-3%;height:67vh"><button class="character-hotspot" data-action="personal-professional" type="button" aria-label="Review personal and professional boundaries with Maria" style="left:50%;transform:translateX(-50%);bottom:2%;width:27%;height:60%"></button></div></section>`}
const ppItems=[
 ['Deciding not to discuss a private family conflict with an acquaintance','personal'],
 ['Using your agency phone rather than your personal number when communicating with clients','professional'],
 ['Saying no when someone asks you to take on something you do not have the energy to do','personal'],
 ['Ending a counseling session at the scheduled time','professional'],
 ['Choosing which personal experiences you are comfortable discussing with friends','personal'],
 ['Declining a client’s invitation to socialize outside the helping relationship','professional']
];
function personalProfessional(){showModal(`<h2>Personal Boundaries vs. Professional Boundaries</h2><div class="compare-panels"><div class="compare-panel"><span class="big-icon">👤</span><h3>Personal Boundaries</h3><p>Personal boundaries are physical, emotional, and mental limits shaped by your values, experiences, and needs.</p><ul><li>Saying no when uncomfortable</li><li>Choosing what personal information to share</li><li>Protecting your time and energy</li></ul></div><div class="compare-panel"><span class="big-icon">🪪</span><h3>Professional Boundaries</h3><p>Professional boundaries are ethical and behavioral guidelines that define appropriate counselor-client interactions.</p><ul><li>Not sharing personal contact information</li><li>Not becoming friends or romantic partners with clients</li><li>Ending sessions on time</li><li>Using professional communication channels</li></ul></div></div><h3>Personal or Professional?</h3><p>Choose the type of boundary illustrated by each situation.</p><div class="risk-table">${ppItems.map((x,i)=>`<div class="risk-row"><strong>${x[0]}</strong><select class="pp-select" data-i="${i}"><option value="">Choose…</option><option value="personal">Personal</option><option value="professional">Professional</option></select></div>`).join('')}</div><div class="button-row center"><button class="primary-btn" data-action="check-pp">Check My Thinking →</button></div><div data-feedback></div>`)}
function whyBoundaries(){showModal(`<h2>Why Boundaries Matter</h2><div class="boundary-card-grid all-beige-boundary"><div class="boundary-card"><span>🛡️</span><strong>Protect Client Well-Being</strong><p>Boundaries create safety and trust, especially for clients who have experienced trauma or instability.</p></div><div class="boundary-card"><span>🤝</span><strong>Build Professional Trust</strong><p>Consistency and reliability help clients understand what they can expect.</p></div><div class="boundary-card"><span>🚧</span><strong>Prevent Harmful Relationships</strong><p>Without clear limits, roles can blur and harm may occur.</p></div><div class="boundary-card"><span>🌱</span><strong>Model Healthy Relationships</strong><p>Clients experience what respect, structure, and appropriate limits look like.</p></div><div class="boundary-card"><span>🧠</span><strong>Support Counselor Well-Being</strong><p>Boundaries help protect objectivity and reduce emotional over-involvement and burnout.</p></div><div class="boundary-card"><span>⚖️</span><strong>Support Ethical &amp; Legal Practice</strong><p>Clear professional limits help protect the client, counselor, agency, certification, and career.</p></div></div><div class="button-row center"><button class="primary-btn" data-action="professional-practice">Continue to Boundaries in Professional Practice →</button></div>`) }

function professionalPractice(){showModal(`<h2>Boundaries in Professional Practice</h2><div class="principle-grid all-beige-principles"><div class="principle-card"><strong>⚖️ Boundaries Uphold Ethics</strong><span>Support ethical codes and state rules, prevent conflicts of interest and favoritism, and protect confidentiality, informed consent, and client autonomy.</span><em>Example: avoiding personal or romantic involvement with clients protects objectivity and reduces exploitation.</em></div><div class="principle-card"><strong>🎯 Boundaries Keep the Focus on the Client</strong><span>Prevent oversharing or seeking support from clients and maintain the therapeutic environment.</span><em>Example: use active listening instead of telling a long personal story.</em></div><div class="principle-card"><strong>🛡️ Boundaries Build Trust &amp; Safety</strong><span>Create predictability, emotional safety, fairness, consistency, and respect.</span><em>Example: starting and ending appointments consistently builds reliability.</em></div><div class="principle-card"><strong>🧠 Boundaries Support Counselor Effectiveness</strong><span>Reduce burnout, maintain objectivity and sound decision-making, and protect against ethical slips.</span><em>Example: seeking supervision when overwhelmed demonstrates healthy self-awareness.</em></div></div><div class="resource-card-static"><strong>📘 Required Reading: NAADAC Code of Ethics</strong><span>Read the NAADAC Code of Ethics and take notes about the sections that seem most relevant to professional boundaries.</span><div class="button-row"><a class="secondary-btn" href="https://www.naadac.org/assets/2416/naadac_code_of_ethics_06012025.pdf" target="_blank" rel="noopener">Open NAADAC Code of Ethics ↗</a></div></div><div class="button-row center"><button class="primary-btn" data-action="boundary-warning">Continue to Boundary Warning Signs →</button></div>`) }
function boundaryWarning(){showModal(`<h2>When Boundaries Blur</h2>${headQuote(IMG.mariaHead,'Maria','“Boundary violations aren’t always dramatic. Sometimes they begin with a decision that seems small or helpful and gradually make the professional relationship less clear.”')}<p>A boundary violation occurs when a counselor crosses the ethical or professional limits of the helping relationship. It may be intentional or accidental, but it can still harm the client, damage trust, and create serious consequences.</p><div class="warning-grid all-beige-warnings"><div class="warning-card"><span>👥</span><strong>Dual Relationships</strong><p>Friendship, romance, business, or another role outside the professional relationship</p></div><div class="warning-card"><span>🗣️</span><strong>Inappropriate Self-Disclosure</strong><p>Sharing too much about recovery, trauma, relationships, or personal life</p></div><div class="warning-card"><span>🎁</span><strong>Gifts & Favors</strong><p>Giving or accepting gifts, money, favors, or special treatment</p></div><div class="warning-card"><span>🤝</span><strong>Physical Contact</strong><p>Touch or hugging without clear boundaries or client consent</p></div><div class="warning-card"><span>🕒</span><strong>Time & Availability</strong><p>Meeting outside scheduled hours, after-hours texting, or repeatedly running over time</p></div><div class="warning-card"><span>❤️</span><strong>Emotional Dependence</strong><p>Rescuing, becoming overly involved, or relying on the client for support</p></div><div class="warning-card"><span>📱</span><strong>Social Media</strong><p>Friending or messaging clients through personal platforms</p></div></div><div class="button-row center"><button class="primary-btn" data-action="ripple">See How Boundary Problems Can Spread →</button></div>`)}
function rippleEffect(){showModal(`<h2>The Ripple Effect</h2><p>A boundary violation can affect more than the counselor-client interaction.</p><div class="ripple-wrap"><div class="ripple-center">Boundary<br>Violation</div><div class="ripple-grid"><div class="ripple-card"><strong>👤 Clients</strong><ul><li>Emotional harm</li><li>Confusion or mistrust</li><li>Re-traumatization</li><li>Dependency</li></ul></div><div class="ripple-card"><strong>🪪 Counselors</strong><ul><li>Burnout</li><li>Loss of objectivity</li><li>Disciplinary action</li><li>Loss of certification</li></ul></div><div class="ripple-card"><strong>🏢 Agencies</strong><ul><li>Legal liability</li><li>Staff turnover</li><li>Loss of funding or credibility</li></ul></div><div class="ripple-card"><strong>🌐 Profession</strong><ul><li>Public mistrust</li><li>Damage to treatment-program reputation</li></ul></div></div></div><h3>How to Reduce Boundary Violations</h3><div class="service-reminder"><span class="service-chip">📘 Know your ethical code</span><span class="service-chip">🧠 Practice self-awareness</span><span class="service-chip">👥 Get supervision when something feels “off”</span><span class="service-chip">💬 Keep communication professional and purposeful</span><span class="service-chip">📝 Document boundary concerns clearly</span></div><div class="button-row center"><button class="primary-btn" data-action="dual-intro">Explore Dual Relationships →</button></div>`)}
const dualItems=[
 ['A CDCA provides services to a client during scheduled agency appointments.','professional'],
 ['A CDCA begins selling products to a current client outside work.','dual'],
 ['A CDCA and current client begin socializing as friends.','dual'],
 ['A counselor realizes that a new client belongs to the same local community organization.','consult'],
 ['A CDCA becomes romantically involved with a client.','dual']
];
function dualRelationships(){showModal(`<h2>When One Relationship Becomes Two</h2><p>A <strong>dual relationship</strong> exists when a professional has more than one role or relationship with a client. Examples include friendship or family relationships, business relationships, belonging to the same social group or organization, or sexual/romantic relationships with a current or former client.</p><p>Dual relationships can create ethical dilemmas because another role may compromise objectivity, competence, effectiveness, or professional judgment. They can potentially exploit or harm the client when personal interests interfere with professional responsibilities.</p><h3>One Role or Two?</h3><p>For each item, decide if you think it is a professional relationship only, a dual relationship, or if it is a potential dual relationship and consultation is needed.</p><div class="risk-table">${dualItems.map((x,i)=>`<div class="risk-row"><strong>${x[0]}</strong><select class="dual-select" data-i="${i}"><option value="">Choose…</option><option value="professional">Professional relationship only</option><option value="dual">Dual relationship</option><option value="consult">Potential dual relationship — seek consultation</option></select></div>`).join('')}</div><div class="button-row center"><button class="primary-btn" data-action="check-dual">Check My Thinking →</button></div><div data-feedback></div><div class="teaching-card"><h3>Ethical Considerations</h3><div class="info-grid"><div class="info-card"><strong>Avoid Harm</strong><span>Avoid relationships that could exploit or harm the client.</span></div><div class="info-card"><strong>Prioritize Client Well-Being</strong><span>Client interests remain the primary concern, including when overlapping relationships are difficult to avoid.</span></div><div class="info-card"><strong>Maintain Boundaries</strong><span>Do not allow another role to interfere with professional judgment.</span></div><div class="info-card"><strong>Seek Consultation</strong><span>Use supervisors or appropriate colleagues when situations are complex.</span></div></div></div><div class="button-row center"><button class="primary-btn" id="ethicsContinue" data-action="ethics-scene" disabled>Enter the Ethics Consultation Room →</button></div>`) }

function ethicsScene(){closeModal();setSection(2);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.supervision}')"><div class="scene-guide">When a boundary feels blurry, professional decisions should be guided by more than instinct.</div><img class="character" src="${IMG.mariaFull}" alt="" style="left:50%;transform:translateX(-50%);bottom:-3%;height:67vh"><button class="character-hotspot" data-action="ethics-toolkit" type="button" aria-label="Open the ethical decision toolkit with Maria" style="left:50%;transform:translateX(-50%);bottom:2%;width:27%;height:60%"></button></div></section>`}
function ethicsToolkit(){showModal(`<h2>Ethical Decision Toolkit</h2>${headQuote(IMG.mariaHead,'Maria','“Ethical codes, laws, agency policies, and supervisors are there for a reason. When a boundary feels blurry, you should never have to guess.”')}<div class="ethics-grid all-beige-ethics"><div class="ethics-card"><span>📘</span><strong>NAADAC Code of Ethics</strong><p>National standards emphasizing client welfare and autonomy, avoidance of harmful dual relationships, informed consent, confidentiality, and cultural competence</p><a class="resource-link" href="https://www.naadac.org/assets/2416/naadac_code_of_ethics_06012025.pdf" target="_blank" rel="noopener">Open the Code ↗</a></div><div class="ethics-card"><span>🏛️</span><strong>Ohio / State Regulations</strong><p>State requirements define CDCA scope of practice and include expectations for professional conduct, client interactions, and disciplinary actions.</p><a class="resource-link" href="https://ocdp.ohio.gov/already-licensed/scope-of-practice/01-cdca-scope" target="_blank" rel="noopener">Ohio CDCA Scope of Practice ↗</a></div><div class="ethics-card"><span>🔒</span><strong>Confidentiality</strong><p>Protected under HIPAA and state laws; breaches may lead to fines or lawsuits</p></div><div class="ethics-card"><span>✍️</span><strong>Informed Consent</strong><p>Clients should understand their rights and the limits of the professional relationship.</p></div><div class="ethics-card"><span>🚫</span><strong>Sexual Misconduct</strong><p>Prohibited by law and ethics codes and can lead to serious criminal and certification consequences</p></div><div class="ethics-card"><span>⚠️</span><strong>Negligence</strong><p>Failing to refer, consult, or maintain professional distance can contribute to harm and liability.</p></div><div class="ethics-card"><span>📣</span><strong>Mandatory Reporting</strong><p>Abuse or danger to self/others requires reporting even when reporting affects rapport.</p></div></div><div class="button-row center"><button class="primary-btn" data-action="scope">Check Your Scope of Practice →</button></div>`)}
function scopePractice(){showModal(`<h2>Scope of Practice Is a Boundary Too</h2><p>CDCAs are entry-level professionals. The role requires clear limits around what you can do independently.</p><div class="scope-grid all-beige-scope"><div class="scope-card"><span>👥</span><strong>Work Under Supervision</strong><p>Use appropriate supervision as part of practice.</p></div><div class="scope-card"><span>➡️</span><strong>Refer When Needed</strong><p>Refer concerns that exceed your role or expertise.</p></div><div class="scope-card"><span>🚫</span><strong>Do Not Diagnose</strong><p>Avoid diagnosis or other work outside CDCA scope.</p></div><div class="scope-card"><span>🧭</span><strong>Stay Within Role</strong><p>Avoid independently providing treatment outside your legal scope.</p></div></div><div class="callout"><strong>Crossing scope-of-practice boundaries can contribute to:</strong> job loss, ethical violations, loss of certification, or criminal charges.</div><h3>What Should You Do When You’re Unsure?</h3><div class="follow-path"><div class="follow-step"><div class="follow-icon">👥</div><div><strong>Consult</strong><span>Talk with a supervisor. Depending on the situation, a mentor or appropriate professional colleague may also help.</span></div></div><div class="follow-step"><div class="follow-icon">📝</div><div><strong>Document</strong><span>Record concerns clearly and professionally.</span></div></div><div class="follow-step"><div class="follow-icon">📚</div><div><strong>Check</strong><span>Review the Code of Ethics and agency policy.</span></div></div><div class="follow-step"><div class="follow-icon">⚠️</div><div><strong>Use Caution</strong><span>When a boundary is unclear, do not guess.</span></div></div></div><div class="button-row center"><button class="primary-btn" data-action="gabriela-scene">Help Gabriela With a Boundary Decision →</button></div>`)}
function gabrielaScene(){closeModal();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.supervision}')"><div class="scene-guide">Gabriela is a CDCA who received a personal social-media request from a client. What should she do?</div><img class="character" src="${IMG.gabrielaFull}" alt="" style="left:50%;transform:translateX(-50%);bottom:-2%;height:68vh"><button class="character-hotspot" data-action="gabriela-case" type="button" aria-label="Review Gabriela's social-media boundary case" style="left:50%;transform:translateX(-50%);bottom:2%;width:28%;height:62%"></button></div></section>`}
function gabrielaCase(){showModal(`<h2>Gabriela Receives a Friend Request</h2><div class="profile-card compact-profile"><img src="${IMG.gabrielaHead}" alt="Gabriela"><div><strong>Gabriela · CDCA</strong><p>A client recently shared sensitive information about past trauma. After the session, the client sends Gabriela a friend request on her personal social media account.</p></div></div><h3>What is the most appropriate action?</h3><div class="choices"><button class="choice-btn" data-action="gabriela-choice" data-v="0"><span class="choice-title">A.</span><span class="choice-text">Accept the request to strengthen trust and connection.</span></button><button class="choice-btn" data-action="gabriela-choice" data-v="1"><span class="choice-title">B.</span><span class="choice-text">Politely decline and explain that professional boundaries prevent personal social media contact with clients.</span></button><button class="choice-btn" data-action="gabriela-choice" data-v="2"><span class="choice-title">C.</span><span class="choice-text">Ignore the request and never mention it.</span></button><button class="choice-btn" data-action="gabriela-choice" data-v="3"><span class="choice-title">D.</span><span class="choice-text">Accept the request but avoid interacting with the client’s posts.</span></button></div><div data-feedback></div>`)}

function selfAwarenessScene(){closeModal();setSection(3);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.wellness}')"><div class="scene-guide">Boundaries also depend on recognizing what is happening inside the counselor.</div><img class="character" src="${IMG.mariaFull}" alt="" style="right:8%;bottom:-3%;height:67vh"><button class="character-hotspot" data-action="triggers" type="button" aria-label="Discuss triggers and self-awareness with Maria" style="right:8%;bottom:2%;width:27%;height:60%"></button></div></section>`}
function triggers(){showModal(`<h2>What’s Happening Inside the Counselor?</h2>${headQuote(IMG.mariaHead,'Maria','“Boundaries aren’t only about what clients ask us to do. They also depend on recognizing what is happening inside ourselves.”')}<p>Triggers are internal or external cues that can lead a person in recovery to experience cravings, relapse, or emotional distress.</p><div class="trigger-grid"><div class="trigger-card"><span>🌎</span><strong>External Triggers</strong><ul><li>Places</li><li>People</li><li>Smells</li><li>Sights</li><li>Events</li></ul></div><div class="trigger-card"><span>🧠</span><strong>Internal Triggers</strong><ul><li>Emotions</li><li>Thoughts</li><li>Memories</li><li>Physical sensations</li></ul></div></div><h3>Why Triggers Matter for CDCAs</h3><p>CDCAs work closely with people who may be highly sensitive to triggers. CDCAs themselves—especially those who are in recovery—may also be vulnerable to their own triggers. If those reactions are not recognized or managed, they can affect:</p><div class="service-reminder"><span class="service-chip">💼 Job performance</span><span class="service-chip">🚧 Boundaries with clients</span><span class="service-chip">🧠 Emotional regulation</span><span class="service-chip">🛟 Personal relapse risk, if in recovery</span></div><div class="button-row center"><button class="primary-btn" data-action="self-awareness">Explore Professional Self-Awareness →</button></div>`)}
function selfAwareness(){showModal(`<h2>Notice Before You React</h2><p><strong>Self-awareness</strong> is the ability to recognize your emotional states, understand your motivations and behavior, and identify your biases, limits, and needs.</p><p>For CDCAs, self-awareness can help you recognize countertransference, know when to seek supervision or support, stay grounded, avoid burnout, and reflect rather than react during stressful situations.</p><div class="pause-path"><div class="pause-step"><span>👀</span><strong>Notice</strong><p>What am I feeling right now?</p></div><div class="pause-arrow">→</div><div class="pause-step"><span>⏸️</span><strong>Pause</strong><p>Do not react automatically.</p></div><div class="pause-arrow">→</div><div class="pause-step"><span>🪞</span><strong>Reflect</strong><p>Why might this situation be affecting me?</p></div><div class="pause-arrow">→</div><div class="pause-step"><span>🧰</span><strong>Use a Tool</strong><p>Grounding, mindfulness, or healthy boundaries</p></div><div class="pause-arrow">→</div><div class="pause-step"><span>👥</span><strong>Seek Support</strong><p>Use supervision or appropriate peer support.</p></div></div><div class="button-row center"><button class="primary-btn" data-action="self-toolkit">Build Your Self-Awareness Toolkit →</button></div>`)}
function selfToolkit(){showModal(`<h2>Build Your Self-Awareness Toolkit</h2><div class="boundary-card-grid all-beige-self"><div class="boundary-card"><span>🌡️</span><strong>Daily Check-In</strong><p>Ask yourself: “How am I feeling right now? What’s going on with me?”</p></div><div class="boundary-card"><span>👥</span><strong>Supervision</strong><p>Use regular supervision to reflect on difficult cases and emotional reactions.</p></div><div class="boundary-card"><span>📓</span><strong>Journaling</strong><p>Track clients, topics, or situations that are emotionally activating.</p></div><div class="boundary-card"><span>🎓</span><strong>Ongoing Education</strong><p>Continue learning about trauma, boundaries, counselor ethics, and wellness.</p></div><div class="boundary-card"><span>🧘</span><strong>Mindfulness & Grounding</strong><p>Use breathing, grounding, and presence-based practices.</p></div><div class="boundary-card"><span>🤝</span><strong>Peer Support</strong><p>Connect appropriately with others in the field to process professional challenges.</p></div></div><div class="callout">When you’re self-aware, you can spot emotional warning signs, identify which clients or topics activate you, pause and respond calmly, and seek support before things become unmanageable. Being aware of your inner world helps you work more effectively, ethically, and empathetically.</div><div class="button-row center"><button class="primary-btn" data-action="reflection2">Apply Self-Awareness →</button></div>`)}
function reflection2(){showModal(`<h2>When a Situation Affects You</h2><div class="field"><label for="selfReflection">Imagine that you notice a client or situation is affecting you emotionally. What warning signs might tell you that you need to pause, and what could you do before responding to the client?</label><textarea id="selfReflection" placeholder="Write your response here.">${esc(state.reflections.selfaware)}</textarea></div><div class="button-row center"><button class="primary-btn" data-action="save-self">Save Response + Continue →</button></div>`)}
function boundaryToolkit(){showModal(`<h2>Strategies for Maintaining Professional Boundaries</h2><div class="toolkit-grid toolkit-row-colors"><div class="toolkit-card"><span>🪪</span><strong>Know Your Role</strong><p>Stay within your training and certification. Refer to a supervisor or licensed professional when a concern exceeds your qualifications.</p></div><div class="toolkit-card"><span>🧭</span><strong>Establish Clear Expectations</strong><p>Discuss the purpose, limits, and structure of the relationship from the beginning, and use informed consent to clarify roles.</p></div><div class="toolkit-card"><span>❤️</span><strong>Maintain Emotional Distance</strong><p>Show empathy and compassion without becoming emotionally over-involved. Recognize and manage countertransference.</p></div><div class="toolkit-card"><span>🗣️</span><strong>Set Limits on Personal Disclosure</strong><p>Share personal experiences only when disclosure clearly benefits the client and aligns with the helping goal.</p></div><div class="toolkit-card"><span>🚧</span><strong>Avoid Dual Relationships</strong><p>Do not engage in relationships outside the professional context that create conflicts of interest or threaten objectivity.</p></div><div class="toolkit-card"><span>👥</span><strong>Use Supervision & Consultation</strong><p>Use supervision to reflect on uncertainty, emotional reactions, and ethical concerns.</p></div><div class="toolkit-card"><span>🕒</span><strong>Respect Time & Space</strong><p>Maintain appropriate session times, availability expectations, and physical boundaries.</p></div><div class="toolkit-card"><span>📱</span><strong>Stay Professional in Communication</strong><p>Use agency-approved channels and keep communication professional and purposeful.</p></div><div class="toolkit-card"><span>📚</span><strong>Follow Agency Policy & Ethical Guidelines</strong><p>Use agency rules and professional ethical standards when decisions are unclear.</p></div></div><div class="button-row center"><button class="primary-btn" data-action="jacob-scene">Review Jacob’s Situation →</button></div>`)}

function jacobCase(){showModal(`<h2>Spot Jacob’s Two Boundary Problems</h2><div class="profile-card compact-profile"><img src="${IMG.jacobHead}" alt="Jacob"><div><strong>Jacob · CDCA</strong><p>During a first session, Jacob tells a long personal story about his own recovery to make the client comfortable. Later in the week, he replies to a late-night text outside scheduled hours to provide emotional support.</p></div></div><p><strong>Which two boundary strategies are most directly involved? Select two.</strong></p><div class="checkbox-grid uniform-blue"><label><input type="checkbox" class="jacob-check" value="role"> Know Your Role</label><label><input type="checkbox" class="jacob-check" value="disclosure"> Set Limits on Personal Disclosure</label><label><input type="checkbox" class="jacob-check" value="supervision"> Use Supervision and Consultation</label><label><input type="checkbox" class="jacob-check" value="time"> Respect Time and Space</label><label><input type="checkbox" class="jacob-check" value="communication"> Stay Professional in Communication</label></div><div class="button-row center"><button class="primary-btn" data-action="check-jacob">Check My Thinking →</button></div><div data-feedback></div>`)}

function wellbeingScene(){closeModal();setSection(4);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.wellness}')"><div class="scene-guide">Healthy boundaries also protect the professional. Maria wants to talk to you about burnout and compassion fatigue.</div><img class="character" src="${IMG.mariaFull}" alt="" style="left:50%;transform:translateX(-50%);bottom:-3%;height:67vh"><button class="character-hotspot" data-action="wellbeing-intro" type="button" aria-label="Discuss burnout and compassion fatigue with Maria" style="left:50%;transform:translateX(-50%);bottom:2%;width:27%;height:60%"></button></div></section>`}
function wellbeingIntro(){showModal(`<h2>When Caring Starts to Cost Too Much</h2><div class="compare-panels"><div class="compare-panel"><span class="big-icon">🔥</span><h3>Burnout</h3><p>A state of emotional, physical, and mental exhaustion caused by prolonged stress, often related to overwhelming work demands</p><p><strong>Common causes:</strong></p><ul><li>High caseloads</li><li>Paperwork or administrative burden</li><li>Unclear role boundaries</li><li>Lack of support or supervision</li><li>Feeling ineffective or undervalued</li></ul><p><strong>Possible signs:</strong></p><ul><li>Feeling drained or irritable</li><li>Trouble concentrating</li><li>Headaches or sleep problems</li><li>Dreading work</li><li>Emotional numbness or cynicism</li></ul></div><div class="compare-panel"><span class="big-icon">💔</span><h3>Compassion Fatigue</h3><p>Emotional strain associated with repeated exposure to the trauma, addiction, suffering, and stories of people being served</p><p><strong>Possible signs:</strong></p><ul><li>Feeling overwhelmed by client stories</li><li>Emotional exhaustion</li><li>Increased anxiety or sadness</li><li>Detachment or reduced empathy</li><li>Difficulty leaving work at work</li></ul></div></div><p class="callout">CDCAs may bring deep empathy to this work. That empathy can be a strength while also increasing vulnerability to compassion fatigue.</p><div class="button-row center"><button class="primary-btn" data-action="wellbeing-quiz">Compare the Signs →</button></div>`)}
const wellbeingItems=[
 ['“My caseload and paperwork feel endless, and I dread going to work.”','burnout'],
 ['“I keep replaying one client’s traumatic story when I get home.”','fatigue'],

 ['“I’ve started feeling detached when clients describe painful experiences.”','fatigue']
];

function conferenceScene(){closeModal();setSection(5);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.conference}')"><div class="scene-guide">Maria has six boundary situations for you to review.</div><img class="character" src="${IMG.mariaFull}" alt="" style="right:8%;bottom:-3%;height:67vh"><button class="character-hotspot" data-action="conference-intro" type="button" aria-label="Join Maria's boundary case conference" style="right:8%;bottom:2%;width:27%;height:60%"></button></div></section>`}
function conferenceIntro(){showModal(`<h2>Harbor Point Case Conference</h2>${headQuote(IMG.mariaHead,'Maria','“Knowing the rule is usually easier than applying it when someone is hurting, transportation is a problem, a gift has meaning, or you genuinely care about someone.”')}<p>You’ll review six situations. The goal is not simply to memorize rules—it is to practice recognizing where a boundary is at risk, what harm could occur, and what a safer professional response might look like.</p><div class="button-row center"><button class="primary-btn" data-action="case1">Open Case 1 →</button></div>`)}
function case1(){showModal(`<h2>Case 1: “It’s Just Coffee”</h2>${duoProfile(IMG.jared,'Jared',IMG.maya,'Maya','Jared is a CDCA in training who works with Maya in a recovery group. After an emotional session, Maya says she does not want to be alone and asks Jared to meet her for coffee to “just talk as friends.” Jared agrees because he believes it is harmless and shows that he cares.')}<div class="decision-grid"><div><label for="c1boundary">What boundary is most directly at risk?</label><select id="c1boundary"><option value="">Choose…</option><option value="scope">Scope of practice</option><option value="dual">Dual relationship</option><option value="confidentiality">Confidentiality</option><option value="reporting">Mandatory reporting</option></select></div><div><label for="c1response">What would be a safer response?</label><select id="c1response"><option value="">Choose…</option><option value="coffee">Meet for coffee but avoid discussing treatment.</option><option value="support">Explain the professional boundary, assess whether Maya needs additional support, and connect her with an appropriate resource.</option><option value="phone">Give Maya a personal phone number instead.</option><option value="alone">Tell Maya she should handle the situation independently.</option></select></div></div><div class="button-row center"><button class="primary-btn" data-action="check-case1">Check My Thinking →</button></div><div data-feedback></div>`)}

ue="">Choose a response…</option><option value="tolerate">Say nothing and tolerate the discomfort.</option><option value="abrupt">Move away suddenly without explanation.</option><option value="respect">Respectfully adjust your chair and explain that you want both people to feel comfortable.</option></select></div></div><div class="button-row center"><button class="primary-btn" data-action="check-culture">Check My Thinking →</button></div><div data-feedback></div>`)}
